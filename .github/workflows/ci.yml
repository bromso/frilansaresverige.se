name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # next build runs under Node (bun scripts spawn the binaries), so pin
      # the same major the production image uses (node:24-alpine).
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (Biome)
        run: bun run check

      # From the repo root on purpose — bunfig.toml's preload path resolves
      # against the invoking directory (see README "Tests").
      - name: Test
        run: bun test

      - name: Build
        run: bun run build
